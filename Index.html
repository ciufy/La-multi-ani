<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Băiatul Meu ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Georgia,serif;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    background:
        radial-gradient(circle at 50% 20%, #492434 0%, #1b1016 38%, #08070a 100%);
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 30%, rgba(255,180,200,.08), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(255,180,200,.06), transparent 30%);
    pointer-events:none;
}

.container{
    width:92%;
    max-width:650px;
    text-align:center;
    position:relative;
    z-index:2;
}

.card{
    padding:55px 30px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:30px;

    background:rgba(255,255,255,.055);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        inset 0 0 40px rgba(255,255,255,.025);

    animation:appear 2s ease;
}

.heart{
    font-size:70px;
    margin-bottom:20px;
    animation:pulse 2.5s infinite;
    filter:drop-shadow(0 0 20px rgba(255,100,140,.35));
}

h1{
    font-size:clamp(42px,10vw,70px);
    font-weight:normal;
    letter-spacing:2px;
}

.subtitle{
    margin-top:14px;
    color:#d9b7c3;
    font-size:15px;
    letter-spacing:4px;
    text-transform:uppercase;
}

.line{
    width:90px;
    height:1px;
    background:#d5a5b5;
    margin:30px auto;
}

.message{
    color:#eee;
    font-size:18px;
    line-height:1.8;
    margin-bottom:32px;
}

.player{
    margin-top:30px;
}

audio{
    width:100%;
    height:52px;
    border-radius:30px;
}

.song{
    margin-top:18px;
    color:#cbaeba;
    font-size:14px;
    letter-spacing:2px;
}

.signature{
    margin-top:38px;
    font-size:24px;
    font-style:italic;
    color:#edc4d0;
}

.footer{
    margin-top:25px;
    color:#85747b;
    font-size:12px;
    letter-spacing:1px;
}

/* inimioare plutitoare */

.heart-float{
    position:fixed;
    bottom:-30px;
    font-size:18px;
    opacity:.35;
    animation:floatUp linear infinite;
    pointer-events:none;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(35px) scale(.97);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.1);
    }
}

@keyframes floatUp{
    from{
        transform:translateY(0) rotate(0deg);
        opacity:0;
    }
    15%{
        opacity:.35;
    }
    to{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}

@media(max-width:500px){
    .card{
        padding:42px 20px;
    }

    .heart{
        font-size:58px;
    }

    .message{
        font-size:16px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="heart">❤️</div>

        <h1>Băiatul Meu</h1>

        <div class="subtitle">
            Din sufletul unei mame
        </div>

        <div class="line"></div>

        <div class="message">
            Pentru copilul meu,<br>
            cu toată iubirea unei mame. ❤️
        </div>

        <div class="player">

            <audio id="music" controls autoplay loop>
                <source src="1.mp3" type="audio/mpeg">
                Browserul tău nu poate reda acest fișier audio.
            </audio>

            <div class="song">
                🎵 O melodie din suflet pentru tine
            </div>

        </div>

        <div class="signature">
            „Mama te va iubi mereu.” ❤️
        </div>

        <div class="footer">
            LA MULȚI ANI, SUFLETUL MEU
        </div>

    </div>

</div>

<script>

/* încearcă pornirea automată */
window.addEventListener("load", function(){

    const music = document.getElementById("music");

    music.volume = 0.7;

    music.play().catch(() => {
        // Browserul poate bloca autoplay.
        // Melodia poate fi pornită din player.
    });

});

/* inimioare plutitoare */

function createHeart(){

    const heart = document.createElement("div");

    heart.className = "heart-float";
    heart.innerHTML = Math.random() > 0.5 ? "❤️" : "♡";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (8 + Math.random() * 8) + "s";
    heart.style.fontSize = (12 + Math.random() * 16) + "px";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    },16000);
}

setInterval(createHeart,1200);

</script>

</body>
  </html>
